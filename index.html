var HG="<div class=\"hg\">\n<p><b>Dùng khi nào:</b> khi dán đơn mà app báo \"Không tìm ra\" hoặc \"Ký hiệu ... chưa biết\".</p>\n<p><b>Ý chính:</b> app chưa biết chữ viết tắt của bạn nghĩa là gì. Bạn dạy nó bằng cách ghép <b>chữ bạn gõ</b> với <b>chữ có trong tên mã hàng</b>.</p>\n<p><b>Ví dụ xuyên suốt:</b> <code>Gel ro: 5 (3c, 2m) KM 1c</code></p>\n<ul><li>c = cứng = <code>RO GEL VUOT TOC GLUE CLASSIC 150G</code></li><li>m = mềm = <code>RO GEL VUOT TOC CLASSIC 150G</code></li></ul>\n<h4>Việc 1: Dạy app tên loại hàng</h4>\n<p>Làm khi gõ \"gel\" mà app không ra gel. Vào tab <b>Loại hàng → ＋ Thêm</b>.</p>\n<table><tr><th>Ô</th><th>Điền</th><th>Ví dụ</th></tr>\n<tr><td>Tên loại</td><td>Tên dễ nhớ</td><td>gel vuốt tóc</td></tr>\n<tr><td>Ký hiệu</td><td>Chữ bạn hay gõ</td><td>gel</td></tr>\n<tr><td>Tên trong mã hàng</td><td>Chữ có trong tên mã, không dấu</td><td>gel vuot toc</td></tr></table>\n<p>Nếu loại hàng đã có (dầu gội, tắm gội, sữa tắm, nước lau sàn…) thì bỏ qua việc này.</p>\n<h4>Việc 2: Dạy app chữ tắt chọn mã</h4>\n<p>Làm khi gõ \"c\", \"m\", \"x\"… mà app không ra đúng mã. Vào tab <b>Hương/màu → ＋ Thêm</b>. Mỗi chữ tắt tạo một lần.</p>\n<table><tr><th>Ô</th><th>Điền</th><th>c (cứng)</th><th>m (mềm)</th></tr>\n<tr><td>Thương hiệu</td><td>ro, en, gvn, cj, mk</td><td>ro</td><td>ro</td></tr>\n<tr><td>Áp dụng cho loại hàng</td><td>Chọn loại hàng ở việc 1</td><td>gel vuốt tóc</td><td>gel vuốt tóc</td></tr>\n<tr><td>Ký hiệu</td><td>Chữ bạn gõ, không dấu</td><td>c</td><td>m</td></tr>\n<tr><td>Tên trong mã hàng</td><td>Chữ chỉ có ở mã này</td><td>glue classic</td><td>toc classic</td></tr></table>\n<p>Hai ô tick bên dưới thường để trống.</p>\n<h4>Cách chọn \"Tên trong mã hàng\"</h4>\n<p>Lấy chữ có ở mã bạn muốn mà mã khác không có.</p>\n<ul><li>Mã cứng có <code>GLUE CLASSIC</code>, mã mềm không có \"glue\" → dùng <code>glue classic</code>.</li>\n<li>Chữ <code>classic</code> có ở cả hai mã nên không dùng một mình. Thêm chữ liền trước thành <code>toc classic</code> thì c function parseBackup(t){
  var res={},cur=null;
  t.split(/\r?\n/).forEach(function(l){
    var m=/^\s*===\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*===\s*$/.exec(l);
    if(m){cur=m[3]+"-"+p2(+m[2])+"-"+p2(+m[1]);res[cur]=[];return}
    if(cur)res[cur].push(l);
  });
  Object.keys(res).forEach(function(k){var x=res[k].join("\n").replace(/\s+$/,"");if(x.trim())res[k]=x;else delete res[k]});
  return res;
}
